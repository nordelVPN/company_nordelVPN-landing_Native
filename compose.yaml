services:
  site:
    build:
      context: .
      dockerfile: docker/site.Dockerfile
    environment:
      BRAND_API_TOKEN: ${BRAND_API_TOKEN:-}
    ports:
      - "127.0.0.1:${SITE_PORT:-3001}:80"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?Set TELEGRAM_WEBHOOK_SECRET in .env}
      WISHLIST_FILE: /data/wishlist.json
    volumes:
      - wishlist:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === 'ok' ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:3
    command: ["http", "bot:8080", "--config", "/etc/ngrok.yml"]
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./docker/ngrok.yml:/etc/ngrok.yml:ro
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wishlist:
