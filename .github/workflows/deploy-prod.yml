name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build:prod

      - name: Verify production bundle
        run: test -s build/prod/index.html

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 62224 179.43.154.10 >> ~/.ssh/known_hosts

      - name: Sync files to production
        run: |
          rsync -avz --delete \
            --exclude='.well-known/' \
            -e "ssh -p 62224" \
            build/prod/ vpn@179.43.154.10:/var/www/vpn/data/www/nordelvpn.com/

      - name: Normalize permissions
        run: |
          ssh -p 62224 vpn@179.43.154.10 \
            "find /var/www/vpn/data/www/nordelvpn.com -type d -exec chmod 755 {} + && find /var/www/vpn/data/www/nordelvpn.com -type f -exec chmod 644 {} +"
